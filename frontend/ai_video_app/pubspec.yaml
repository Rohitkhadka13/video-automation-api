name: ai_video_saas
description: AI Video Automation SaaS - Flutter client
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ─── State management ────────────────────────────────────────────
  flutter_bloc: ^8.1.5
  bloc: ^8.1.4
  equatable: ^2.0.5

  # ─── Code generation ─────────────────────────────────────────────
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # ─── Navigation ──────────────────────────────────────────────────
  go_router: ^14.2.0

  # ─── Dependency injection ────────────────────────────────────────
  get_it: ^7.7.0

  # ─── Networking ──────────────────────────────────────────────────
  dio: ^5.5.0
  connectivity_plus: ^6.0.3

  # ─── Local storage ───────────────────────────────────────────────
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.1

  # ─── Functional programming (Either / Option) ────────────────────
  dartz: ^0.10.1

  # ─── File picking & media ────────────────────────────────────────
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  video_player: ^2.9.1
  cached_network_image: ^3.3.1

  # ─── UI utilities ────────────────────────────────────────────────
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  percent_indicator: ^4.2.3
  intl: ^0.20.0
  timeago: ^3.7.0

  # ─── Utilities ───────────────────────────────────────────────────
  logger: ^2.4.0
  uuid: ^4.4.2
  path: ^1.9.0
  mime: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ─── Code generation ─────────────────────────────────────────────
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0

  # ─── Testing ─────────────────────────────────────────────────────
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  mockito: ^5.4.4

  # ─── Linting ─────────────────────────────────────────────────────
  flutter_lints: ^4.0.0
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700