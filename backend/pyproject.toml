# =============================================================================
# AI Video SaaS — backend/pyproject.toml
# Project metadata, tool configuration, and pytest settings.
# =============================================================================

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ai-video-saas-backend"
version = "0.1.0"
description = "AI Video Automation SaaS — FastAPI backend"
requires-python = ">=3.12"
license = { text = "MIT" }

# =============================================================================
# Pytest configuration
# =============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# asyncio mode: auto — every async def test is treated as asyncio automatically
asyncio_mode = "auto"

# Show local variables on failure, short traceback format
addopts = [
    "--tb=short",
    "--strict-markers",
    "-v",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=80",
    "-p", "no:warnings",
]

# Custom markers to categorize and selectively run tests
markers = [
    "unit: fast, isolated unit tests (no DB, no network)",
    "integration: tests that use a real DB or external service",
    "slow: tests that take more than 2 seconds",
    "auth: authentication and authorization tests",
    "video: video processing pipeline tests",
]

# Filter out known noisy third-party deprecation warnings
filterwarnings = [
    "ignore::DeprecationWarning:passlib",
    "ignore::DeprecationWarning:jose",
    "ignore::PendingDeprecationWarning",
]

# =============================================================================
# Coverage configuration
# =============================================================================
[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "app/db/init_db.py",          # seed script, not business logic
    "app/core/logging.py",        # logging config
    "*/migrations/*",
    "*/alembic/*",
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "pass",
    "@abstractmethod",
]

# =============================================================================
# Ruff (linter + formatter)
# =============================================================================
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "ANN",  # flake8-annotations (partial)
    "S",    # flake8-bandit (security)
    "RUF",  # ruff-specific
]
ignore = [
    "ANN101",  # self type annotation not required
    "ANN102",  # cls type annotation not required
    "S101",    # assert is fine in tests
    "B008",    # FastAPI Depends() in default args is intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ANN"]
"alembic/*" = ["ANN", "N999"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# =============================================================================
# Mypy
# =============================================================================
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "jose.*", "passlib.*"]
ignore_missing_imports = true

# =============================================================================
# Setuptools package discovery
# =============================================================================
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]