# =============================================================================
# backend/alembic.ini
# Alembic migration configuration.
# The actual DATABASE_URL is injected by alembic/env.py from app settings
# so this file never contains credentials.
# =============================================================================

[alembic]
script_location = alembic
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
truncate_slug_length = 40
revision_environment = false
sourceless = false
output_encoding = utf-8

# DSN placeholder — overridden by env.py at runtime
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Run ruff on every generated migration file
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S