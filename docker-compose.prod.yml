# =============================================================================
# docker-compose.prod.yml
# Production overrides — used with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Changes from dev:
#   - No --reload on uvicorn
#   - Multiple API workers
#   - No source volume mounts (code baked into image)
#   - Resource limits on all containers
#   - Nginx profile active
#   - Flower profile disabled (use Prometheus/Grafana instead)
# =============================================================================

version: "3.9"

services:
  api:
    volumes: []          # no source mount — use baked image
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 4
      --loop uvloop
      --http httptools
      --log-level warning
      --no-access-log
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - API_RELOAD=false
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  celery_worker:
    volumes: []
    environment:
      - APP_ENV=production
    deploy:
      replicas: 2        # scale workers independently
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 1G

  celery_beat:
    volumes: []
    environment:
      - APP_ENV=production
    deploy:
      replicas: 1        # only ONE beat scheduler — never scale this
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  postgres:
    environment:
      POSTGRES_MAX_CONNECTIONS: "200"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          memory: 1G
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c maintenance_work_mem=256MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=10MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB

  redis:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  nginx:
    profiles: []         # enable nginx in production (remove profile gate)
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  # Disable flower in production — use Prometheus + Grafana instead
  flower:
    profiles:
      - disabled