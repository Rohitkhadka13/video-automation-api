# =============================================================================
# AI Video Automation SaaS — docker-compose.yml
# Development environment: all services in one compose file.
# Production: use docker-compose.prod.yml overrides.
# =============================================================================
 
 
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"
 
x-backend-common: &backend-common
  build:
    context: ./backend
    dockerfile: Dockerfile
  env_file:
    - .env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - ./backend:/app
    - media_volume:/app/media
  networks:
    - saas_network
  logging: *default-logging
  restart: unless-stopped
 
services:
 
  # ---------------------------------------------------------------------------
  # PostgreSQL 16
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: saas_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - saas_network
    logging: *default-logging
 
  # ---------------------------------------------------------------------------
  # Redis 7 — broker + result backend for Celery
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: saas_redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - saas_network
    logging: *default-logging
 
  # ---------------------------------------------------------------------------
  # FastAPI — async API server via Uvicorn
  # ---------------------------------------------------------------------------
  api:
    <<: *backend-common
    container_name: saas_api
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/app
      --log-level info
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - SERVICE_NAME=api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
 
  # ---------------------------------------------------------------------------
  # Celery — default queue worker (video processing, transcription, TTS)
  # ---------------------------------------------------------------------------
  celery_worker:
    <<: *backend-common
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: saas_celery_worker
    command: >
      celery -A app.infrastructure.celery.celery_app:celery_app worker
      --loglevel=info
      --concurrency=4
      --queues=default,video,transcription,tts
      --hostname=worker@%h
    environment:
      - SERVICE_NAME=celery_worker
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.infrastructure.celery.celery_app:celery_app inspect ping -d worker@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
 
  # ---------------------------------------------------------------------------
  # Celery Beat — periodic task scheduler
  # ---------------------------------------------------------------------------
  celery_beat:
    <<: *backend-common
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: saas_celery_beat
    command: >
      celery -A app.infrastructure.celery.celery_app:celery_app beat
      --loglevel=info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      - SERVICE_NAME=celery_beat
    depends_on:
      - celery_worker
 
  # ---------------------------------------------------------------------------
  # Flower — Celery monitoring UI (dev only)
  # ---------------------------------------------------------------------------
  flower:
    <<: *backend-common
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: saas_flower
    command: >
      celery -A app.infrastructure.celery.celery_app:celery_app flower
      --port=5555
      --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-secret}
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    environment:
      - SERVICE_NAME=flower
    profiles:
      - monitoring
 
  # ---------------------------------------------------------------------------
  # Ollama — local LLM inference (Llama 3)
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: saas_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    # GPU: uncomment the deploy block if you have an NVIDIA GPU
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    networks:
      - saas_network
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
 
  # ---------------------------------------------------------------------------
  # Ollama model bootstrap — pulls llama3 on first start, then exits
  # ---------------------------------------------------------------------------
  ollama_pull:
    image: ollama/ollama:latest
    container_name: saas_ollama_pull
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Pulling ${OLLAMA_MODEL:-llama3}..."
        ollama pull ${OLLAMA_MODEL:-llama3}
        echo "Model ready."
    environment:
      - OLLAMA_HOST=http://ollama:11434
    networks:
      - saas_network
    restart: "no"
 
  # ---------------------------------------------------------------------------
  # Alembic migrations — runs once then exits (init container pattern)
  # ---------------------------------------------------------------------------
  migrate:
    <<: *backend-common
    container_name: saas_migrate
    command: alembic upgrade head
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
 
  # ---------------------------------------------------------------------------
  # Nginx — reverse proxy (dev: optional, prod: required)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: saas_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - media_volume:/var/www/media:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - saas_network
    logging: *default-logging
    profiles:
      - production
 
# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local
  media_volume:
    driver: local
 
# =============================================================================
# Networks
# =============================================================================
networks:
  saas_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16